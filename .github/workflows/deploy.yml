name: Deploy to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Docker image
        run: |
          docker build -t gc-tiger-bot:${{ github.sha }} .
          az acr login --name rycontainers
          docker tag gc-tiger-bot:${{ github.sha }} rycontainers.azurecr.io/gc-tiger-bot:${{ github.sha }}
          docker push rycontainers.azurecr.io/gc-tiger-bot:${{ github.sha }}
          docker tag gc-tiger-bot:${{ github.sha }} rycontainers.azurecr.io/gc-tiger-bot:latest
          docker push rycontainers.azurecr.io/gc-tiger-bot:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: gctigerwebapp
          images: rycontainers.azurecr.io/gc-tiger-bot:${{ github.sha }}
